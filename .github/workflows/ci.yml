name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Worker protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check-public-tree.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
  windows:
    name: Native Windows build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: powershell -NoProfile -File tests/test_windows_setup.ps1
      - run: powershell -NoProfile -File tests/test_telemetry_setup.ps1
      - name: Compile desktop bundle (no CUDA runtime or release)
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name DynoWorker --paths src worker/windows/entry.py
      - name: Validate setup script syntax
        shell: pwsh
        run: |
          Get-ChildItem worker/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw $errors }
          }
